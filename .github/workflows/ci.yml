name: Integration checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m scripts.check_repository_contents
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: uv sync --locked
      - run: uv run python -m scripts.install_demo_data
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m scripts.check_repository_contents
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
      - run: uv run python -m scripts.install_demo_data
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - name: Use hosted Chrome or install it when absent
        timeout-minutes: 3
        run: |
          if command -v google-chrome > /dev/null; then
            google-chrome --version
          else
            npx --prefix frontend playwright install --with-deps chrome
          fi
      - name: Run local browser workflow checks
        run: |
          export DECISIONIQ_DB_PATH=/tmp/foresight-browser-ci.sqlite3
          uv run uvicorn decisioniq.main:app --host 127.0.0.1 --port 8083 > /tmp/decisioniq-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8083/health > /dev/null; then break; fi
            sleep 1
          done
          npm --prefix frontend run test:browser
