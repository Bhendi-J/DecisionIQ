[project]
name = "foresight"
version = "1.0.0"
description = "Integrated finance, login anomaly, and email phishing intelligence API"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "scikit-learn==1.9.1",
  "xgboost>=3.2,<4",
  "prophet>=1.1.6,<2",
  "joblib>=1.4,<2",
  "python-dotenv>=1,<2",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
phishing = ["torch>=2.6,<3", "transformers>=4.46,<6"]
training = ["datasets>=3,<6", "accelerate>=1,<2", "openpyxl>=3.1,<4", "matplotlib>=3.9,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
